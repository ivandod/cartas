name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run unit tests
        run: lua5.1 tests/test_cartas.lua
      - name: Audit public repository
        shell: pwsh
        run: ./tools/Test-PublicRepository.ps1
      - name: Validate CurseForge release configuration
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath ./Cartas.toc -Pattern '^## Version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          ./tools/Publish-CurseForge.ps1 -Tag "v$version" -DryRun
